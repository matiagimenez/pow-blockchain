services:
  redis:
    container_name: redis
    image: redis:8.4.0-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis:/data
    command: ['redis-server', '--appendonly', 'yes']
    restart: always
    networks:
      - blockchain-network

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.2.1-management
    restart: always
    hostname: 'rabbit'
    ports:
      - '15672:15672'
      - '5672:5672'
    environment:
      RABBITMQ_DEFAULT_USER: 'admin'
      RABBITMQ_DEFAULT_PASS: 'password'
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks:
      - blockchain-network

  block_orchestrator:
    build: ./block-orchestrator
    container_name: block-orchestrator
    depends_on:
      - redis
      - rabbitmq
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: 'rabbitmq'
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: 'admin'
      RABBITMQ_PASSWORD: 'password'
      RABBITMQ_EXCHANGE: 'blockchain'
      HASH_CHALLENGE: '0000'
      RABBITMQ_TRANSACTIONS_QUEUE: 'transactions'
      RABBITMQ_TRANSACTIONS_ROUTING_KEY: 'tx'
      RABBITMQ_TASKS_QUEUE: 'tasks'
      RABBITMQ_TASKS_ROUTING_KEY: 't'
      BLOCK_CREATION_INTERVAL: 60
    ports:
      - '8000:8000'
    networks:
      - blockchain-network

  pow_miner:
    build: ./pow-miner
    container_name: pow-miner
    depends_on:
      - redis
      - rabbitmq
      - block_orchestrator
    environment:
      RABBITMQ_HOST: 'rabbitmq'
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: 'admin'
      RABBITMQ_PASSWORD: 'password'
      RABBITMQ_EXCHANGE: 'blockchain'
      RABBITMQ_TASKS_QUEUE: 'tasks'
      RABBITMQ_TASKS_ROUTING_KEY: 't'
      BLOCK_ORCHESTRATOR_URL: 'http://block-orchestrator:8000'
      POOL_MANAGER_URL: 'http://pool-manager:5002'
    ports:
      - '5000:5000'
    networks:
      - blockchain-network

  pool-manager:
    depends_on:
      - rabbitmq
      - redis
    build: ./pool-manager
    container_name: pool-manager
    ports:
      - '5002:5002'
    environment:
      - RABBITMQ_HOST='rabbitmq'
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER='admin'
      - RABBITMQ_PASSWORD='password'
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CPU_HASH_CHALLENGE=0000
      - GPU_HASH_CHALLENGE=000000
      - KEEP_ALIVE_INTERVAL=25
      - MAX_RANGE=100000
      - CPU_MINERS_COUNT=5
      - EXPIRATION_TIME=15
    networks:
      - blockchain-network
networks:
  blockchain-network:
volumes:
  redis:
  rabbitmq:
